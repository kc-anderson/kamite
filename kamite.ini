# The game (USA, SLUS-21503) native port: settings of kamite.exe.
# Read at start-up; written with these defaults when it is missing ("kamite.exe --write-settings" only writes it).
# Each setting becomes an environment variable for this run. A variable already set in the environment wins, and
# the command line (--headless, --window, --time-limit) wins over both.
# Relative paths are resolved against the folder that holds kamite.exe.

[Game]
# Your own disc image (USA, SLUS-21503). Empty = the first .iso in a "game" folder (next to kamite.exe or up to three
# folders above it) whose SYSTEM.CNF boots cdrom0:\SLUS_215.03;1.
Iso=

# 1 = 60 FPS mode: the game runs at 60 frames per second (gameplay and cutscenes). Port of the PCSX2 60 FPS patch
# (src/kamite/frame_patches.cpp); known differences there: enemy backflips are faster, texture animations run 2x.
Fps60=0
# 1 = L3 dashes: a quick double tap forward on the left stick, then forward held while L3 is (pnach "IF L3 Pressed
# then DASH", made to work with the port's pad timing).
L3Dash=0
# Time to pick a roulette move: normal (the PS2's), double (twice as long; the dial runs half as fast). Any frame rate.
RouletteTimer=normal
# 1 = Hard can be picked on the difficulty select from the start (normally after a clear). Your save is not changed.
UnlockHard=0
# 1 = start at the main menu: no Capcom / Clover logos and no "Press Start" screen at boot.
SkipIntro=0
# 1 = style switching: up to four sets of techniques saved as styles (Techniques screen: hold Triangle + d-pad) and
# swapped in play with the d-pad (src/kamite/style_presets.cpp).
StyleSwitching=0
# 1 = better shop & casino poses: the bystanders set in npc_poses.txt (F2 > NPCs) lean on their counters and tables.
NpcPoses=0
# 1 = enemies follow the wider view: the angles round Gene in which they close in and lunge widen by as much as the
# picture reaches further round him than the PS2's did (docs/enemy-ai.md), so the enemies you can see at the edges
# join in as they did at the PS2's edges. 0 = their original angles. Nothing changes at 4:3 and 100%.
EnemiesFollowView=1
# Control style: classic = as on the PS2; modern = the right stick turns a free camera round Gene and the left stick
# moves him relative to the camera. In modern, the original controls (tank movement, right stick = dodges, the camera
# behind Gene) are in effect while L1 is held (ModernL1=hold) or after a press of L1 until the next (toggle), and with
# ModernAuto=1 also in fights (from the battle camera coming on until no enemy is within 3 m for 1.5 s). Double-tap L1 = the original quick
# turn. Whenever the game takes the camera (grabs, special moves, cutscenes) the controls are the original ones.
# F2 > Controls changes all of this while playing.
ControlStyle=classic
ModernAuto=1
ModernL1=hold
# Button prompts for a controller: auto (from the controller in use; PlayStation pads keep the game's own art), xbox,
# playstation, nintendo, steam (Steam Deck / Steam Controller). Keys and mouse always show keys. Full resolution from
# Xelu's free prompts (CC0, resources/prompts/xelu), with or without a texture pack.
ButtonPrompts=auto
# The free camera's speeds at full stick (degrees a second) and inverted axes.
CameraSpeed=200
CameraPitchSpeed=80
CameraInvertX=0
CameraInvertY=0
# Modern: the mouse turns the free camera (click in the game to capture the mouse, Esc frees it); degrees per pixel.
MouseCamera=1
MouseSensitivity=0.1

[Sound]
# 1 = no music: stage, boss, menu and minigame music play silent; cutscenes keep their sound (music and voices are one
# stream there), as do sound effects and movies.
MuteMusic=0

[Mods]
# Who you play as: gene (the game's own) or a character folder under mods/characters (xavier: Xavier from Xavier:
# Renegade Angel, built from your disc by the build). Other characters keep Gene's moves and his gauntlet arm.
Character=gene

[Launcher]
# The start screen in the game window (Install, Play, Options). 0 = start the game directly; holding Shift while the
# game starts shows it again. Not shown in hidden runs (Headless=1) or when a disc image is passed with --iso.
Show=1
# 1 = the launcher's Options show the advanced settings (e.g. the camera's own values next to its presets).
ShowAdvanced=0

[Run]
# 1 = hidden: the window is created invisible and the sound is muted. 0 = a normal window.
Headless=1
# Wall-clock limit of the run in seconds (0 = none). At the limit kamite.exe writes a hang dump (guest threads, DMA,
# timers, the hottest guest PCs; KAMITE_DUMP_RAM below), asks the runtime to stop and exits with code 124.
TimeLimitSeconds=120
# The hang dump at the time limit: 1 = yes, 0 = no.
DumpOnTimeLimit=1
# A call to a guest address with no recompiled function: stop (log the target, write PS2X_DUMP_RAM_ON_MISSING,
# stop the run, exit code 5), continue, break (debugger) or skip (debug only: hides bugs).
MissingFunction=stop
# Every SNR2 DLL the game links (name, base address, size) is logged as [DLL] lines; also as CSV rows in this file.
DllLog=logs/dll_loads.csv
# stdout and stderr: empty = the console; a file name = appended to that file.
LogFile=
# Dev: a test script (claude/test-mode.md): loads a save state, records the pad or plays a recording back, logs one
# CSV row per game frame and quits by itself. Empty = none.
Test=

[Video]
# pcsx2 = PCSX2's hardware renderer (pcsx2gs.dll, Direct3D 11) with the game's PCSX2 GameIndex fixes (default; built
# unless CMake is configured with -DKAMITE_PCSX2_GS=OFF). native = the runtime's own GS. Without pcsx2gs.dll next to
# kamite.exe the native GS is used. With pcsx2 the F1 Controls screen cannot be drawn yet (edit controls.ini, or
# rebind once with Renderer=native). HD textures: a folder holding replacements/ (PCSX2's names and formats) set as
# PS2X_PCSX2_TEXTURE_DIR under [Runtime], or textures/SLUS-21503 next to kamite.exe; PS2X_PCSX2_TEXTURES=0 = off.
Renderer=pcsx2
# Internal resolution: 1 = native PS2 (512x448), 2..8 = that many samples per pixel each way. 3 = a 1536x1344 frame,
# shown 4:3 at up to 1920x1440 on a 2560x1440 screen (full 60 fps on an RTX 4070 Ti SUPER, 2026-10-17); 4 = 2048x1792,
# sharper but the GPU fell to ~45-50 frames/s in gameplay there. Above 1 the game's interlace flicker filter is left
# out of the flip copy (it would show every edge three times).
InternalResolution=3
# Ignored while Headless=1. StartFullscreen = borderless full screen (F11 switches back to a window); the picture keeps
# the PS2's 4:3 shape.
# The picture's shape: 4:3 (the PS2's), 16:9, 16:10, 21:9, 32:9, any <width>:<height> or ratio (1.7778), or auto
# (the screen's shape). Wider than 4:3 widens the camera (port of the PCSX2 widescreen patch) and narrows the 2D.
AspectRatio=16:9
# Where the in-game HUD goes when wider than 4:3 (F7 switches while playing): 16:9 = at the screen edges (wider
# screens: the edges of a 16:9 area in the middle; narrower than 16:9: as 4:3); 4:3 = where the PS2 had it. Menus are
# always drawn as on the PS2, in the middle 4:3.
HudLayout=16:9
# Menus and screens (pause, options, roulette setup) when wider than 4:3: 4:3 = shown 4:3 with side bars, as drawn
# for the PS2; stretch = stretched to the screen.
MenuLayout=4:3
# Field of view of the gameplay camera, in percent of the game's (100 = as on the PS2; 50..200), outside fights and
# in them (while the game's battle camera is on: Gene has an enemy targeted). Cutscenes keep their framing.
# Widescreen already widens the view sideways on its own; this widens (or narrows) it both ways. Enemy behaviour does
# not depend on the camera (enemies go by the way Gene faces), so neither changes how they fight.
FieldOfView=100
FightFieldOfView=100
# The launcher's Camera presets set these four; the F2 menu's Camera tab changes them while playing (and saves them
# here). How the camera follows a wider field of view: CameraDistance = how far it comes in toward Gene, in percent (0 = it
# stays where it was, so the view looks zoomed out; 100 = Gene keeps the size he has at 100%); CameraTilt = degrees
# the camera rises and looks down at Gene at the FieldOfView above (none at 100%; e.g. 5 or 10).
CameraDistance=100
CameraTilt=0
# 1 = steady idle camera: while Gene stands idle the camera neither rocks with his stomps nor shakes from them.
SteadyIdleCamera=0
# See-through (experimental): walls, pillars and the like between the camera and Gene dissolve in an oval round him
# (0 = off; a banded blur shows where hazy distance is seen through the dissolve, DepthOfField=0 removes it). The
# oval's half-width and half-height round his middle (metres), how much nearer the camera than him things must be to
# dissolve (metres; the ground below his middle never does), the strength (percent: 100 = fully gone in the middle) and the soft edge (percent of the oval).
# SeeThrough also turns near geometry on: walls next to the camera, which the PS2 drops, are cut and drawn so they can
# dissolve (read at start).
SeeThrough=1
SeeThroughWidth=1.6
SeeThroughHeight=2.2
SeeThroughMargin=0.5
SeeThroughStrength=100
SeeThroughSoftness=40
# Window size at start: auto = follows the internal resolution (448 x InternalResolution high, at most 9/10 of the
# screen) in the picture's shape, centered; <width>x<height> (e.g.
# 1920x1440); native = 640x480 as before. Ignored with StartMaximized or StartFullscreen.
WindowSize=auto
StartMaximized=0
StartFullscreen=0
# The game's blur effects (depth of field, the heat haze) are drawn from small copies of the frame. ps2 = those copies
# at the PS2's resolution (PCSX2's fix for the game: always aligned, grainy at high internal resolutions); upscaled =
# at the internal resolution (PCSX2's AggressiveUpscaled); off = no fix (the effects may misalign).
PostEffects=ps2
# 1 = the game's depth of field (the blur of the distance); 0 = off. F2 > Graphics switches it while playing.
DepthOfField=1
# 1 = precise depth: the game's 16-bit depth is coarse in the distance, so surfaces that meet there cut into each
# other in jagged, shifting slivers (on the PS2 too, under a pixel); the renderer takes each perspective-textured
# surface's exact depth from its texture perspective (Q) instead. 0 = as the PS2. F2 > Graphics switches it live.
PreciseDepth=1
# 1 = perspective shading: the PS2 spreads vertex lighting and shadows evenly across the screen rather than along the
# surface, so shading near the camera shifts as the camera turns (the warehouse floor's shadow); the renderer
# interpolates it with perspective, like the textures. 0 = as the PS2. F2 > Graphics switches it live.
PerspectiveShading=1


[Hotkeys]
# The port's shortcut keys: a key name (F5, K, Keypad+1, PageUp...), with Shift+ or Ctrl+ in front if you like, a
# controller button as the game sees it (Right Stick Press, Select, L1...), or none. The launcher's Controls tab and the F2 menu's
# Controls tab edit them. F1 (the Controls screen) stays fixed.
Menu=F2
SaveState=F5
LoadState=F9
# Dev: start / stop recording a test case (claude/test-mode.md): press once, do the move, press again.
RecordCase=Right Stick Press
FpsOverlay=F3
Fullscreen=F11
HudLayout=F7
Dump2D=F6
ReloadPnach=F4
RamDump=F8
DebugDump=Shift+F8
GifDump=F10
DrawDump=Shift+F10
DebugPanel=F12

[Runtime]
# Environment switches of the runtime (PS2X_*) and of this port (KAMITE_*), passed through as written.
# The 32 MB of guest RAM, written when the run stops on a missing function.
PS2X_DUMP_RAM_ON_MISSING=logs/missing_ram.bin
# The 32 MB of guest RAM, written by the hang dump (time limit, KAMITE_HANG_DUMP).
KAMITE_DUMP_RAM=logs/timeout_ram.bin
# Port trace categories: BOOT,LOADER,FILE,EE,IOP,GS,VU,SPU2,INPUT,GAME,HOOK,DLL or ALL. Empty = off.
KAMITE_TRACE=
# Host thread placement: off leaves the OS scheduler alone (auto|spread|ccx place the runtime's threads).
PS2X_THREAD_POLICY=off
# FPS overlay (F3): 0 = off.
PS2X_SHOW_FPS=0
# The branch trace printed with a missing function needs PS2X_BRANCH_TRACE=<entries> in the real environment before
# kamite.exe starts (the runtime reads it before main), so it has no effect here; "python build.py boot" sets it.
# Controls: controls.ini next to kamite.exe (KAMITE_CONTROLS_FILE=<file> for another one). F1 in the game (or
# Back+Start on a controller) opens the Controls screen that rebinds keys, mouse buttons and controller buttons and
# saves that file. Player 1 default layout: D-pad on the arrow keys, Triangle/Square/Cross/Circle on I/J/K/L, left
# stick on WASD, Start = Enter, Select = Backspace, L1/R1 = Q/E, L2/R2 = 1/3, L3/R3 = F/G; controllers keep their
# normal buttons. PS2X_PAD1_* lines here are only read to write controls.ini when it is missing. F12 = the debugger.
