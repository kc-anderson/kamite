[general]
# r501.rel (SNR2 DLL, "..\PS2_EE_Release\r501.elf") statically linked at 0x00799080 by
#   python -I tools/snr2/gen_modules.py r501   (= tools/snr2/snr2.py emit r501 --base 0x799080)
# and recompiled by 'python -I build.py modules r501' into build/snr2/gen/r501, then packed into
# generated_modules/r501/ (never generated/). Class 'room': slot heap 0x799000/0xF000 (cRelSys_loadSlot ReadAlloc, ra 0x2BE5A0, redirected from heap D 0x754220).
# The generated code is valid only at that base (literal PCs/return addresses), checked at link time by
# src/kamite/function_hooks.cpp (name + base + code sha256).
# Paths are relative to this file; build.py modules makes them absolute.
input = "../../build/snr2/out/r501/r501.elf"
output = "../../build/snr2/gen/r501"
single_file_output = false
output_worker_threads = 4
# 77 routine starts from snr2.py. Authoritative.
ghidra_output = "../../build/snr2/out/r501/r501_functions.csv"
ghidra_map_merge = true
patch_syscalls = false
patch_cop0 = false
patch_cache = false
auto_stub_by_name = false
direct_tail_calls = false
skip = []
stubs = []
# No runtime relocations: every import resolves to a boot .sndata export at static-link time
# (r501_runtime_relocations.csv has 0 rows).

# 60 FPS family 1 (census Nov 2): the stage 5 shooting minigame's timers (UFO / EnemyShip / Site / CannonGame code
# after the float helpers, unexported): +0x28 / +0x20 (0x79E2C0 / 0x79E2CC), +0x14 (load and decrement in delay
# slots: its store at 0x79F354), +0x18, the state timers +0x70 (0x79F6F0, 0x79F8DC, 0x79FAAC load, 0x79FD54).
# Not done: its per-frame float steps (e.g. 0x79F6D0..0x79F6FC: +0x10 +=, +0x14 -= 0.05): needs a case at 60.
[[patches.hooks]]
address = "0x0079E2C0"
hook = "km_fps60_countdown_self"
flag = "fps60"
replace = true

