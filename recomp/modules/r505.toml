[general]
# r505.rel (SNR2 DLL, "..\PS2_EE_Release\r505.elf") statically linked at 0x00799080 by
#   python -I tools/snr2/gen_modules.py r505   (= tools/snr2/snr2.py emit r505 --base 0x799080)
# and recompiled by 'python -I build.py modules r505' into build/snr2/gen/r505, then packed into
# generated_modules/r505/ (never generated/). Class 'room': slot heap 0x799000/0xF000 (cRelSys_loadSlot ReadAlloc, ra 0x2BE5A0, redirected from heap D 0x754220).
# The generated code is valid only at that base (literal PCs/return addresses), checked at link time by
# src/kamite/function_hooks.cpp (name + base + code sha256).
# Paths are relative to this file; build.py modules makes them absolute.
input = "../../build/snr2/out/r505/r505.elf"
output = "../../build/snr2/gen/r505"
single_file_output = false
output_worker_threads = 4
# 49 routine starts from snr2.py. Authoritative.
ghidra_output = "../../build/snr2/out/r505/r505_functions.csv"
ghidra_map_merge = true
patch_syscalls = false
patch_cop0 = false
patch_cache = false
auto_stub_by_name = false
direct_tail_calls = false
skip = []
stubs = []
# No runtime relocations: every import resolves to a boot .sndata export at static-link time
# (r505_runtime_relocations.csv has 0 rows).

# 60 FPS family 1 (census Nov 2): cR505::ElectricTask's three countdowns (+0x30.., a sleep(1) loop: counted per poll,
# so the load is raised on second halves). `if (n > 0) n--; else { next step of the spark pattern: SetEffect /
# KillEffect, n = pattern[i + 1] }`: raised at 0 too (Nov 7, K's case electricity_check: 0 was left as is, so the
# pattern stepped on the second half as well and ran a vblank early every step, 5 steps ahead over the case).
[[patches.hooks]]
address = "0x00799C40"
hook = "km_fps60_r505_cd_s2_0"
flag = "fps60"
replace = true

# Nov 7 (electricity_check): the sparks' glow pulse counter +0x14 (alpha = 0.5 + 0.5 sin(2 pi (n / +0x18) - pi) on the
# four spark objects' +0x24C) counted every vblank: twice the pulse rate. Every other vblank.
[[patches.hooks]]
address = "0x00799D28"
hook = "km_fps60_countup_self"
flag = "fps60"
replace = true

# Nov 7 (electricity_check): the buzz sound's timer +0x3C -= 1.0 a poll (SE 0x72 again when it runs out, reset to
# +0x40 = 30 / 16 frames): the buzz repeated twice as often. -= 0.5 (lui 0x3F80 -> 0x3F00).
[[patches.conditional]]
address = "0x00799E60"
value = "0x3C013F00"
flag = "fps60"

