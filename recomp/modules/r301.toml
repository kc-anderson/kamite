[general]
# r301.rel (SNR2 DLL, "..\PS2_EE_Release\r301.elf") statically linked at 0x00799080 by
#   python -I tools/snr2/gen_modules.py r301   (= tools/snr2/snr2.py emit r301 --base 0x799080)
# and recompiled by 'python -I build.py modules r301' into build/snr2/gen/r301, then packed into
# generated_modules/r301/ (never generated/). Class 'room': slot heap 0x799000/0xF000 (cRelSys_loadSlot ReadAlloc, ra 0x2BE5A0, redirected from heap D 0x754220).
# The generated code is valid only at that base (literal PCs/return addresses), checked at link time by
# src/kamite/function_hooks.cpp (name + base + code sha256).
# Paths are relative to this file; build.py modules makes them absolute.
input = "../../build/snr2/out/r301/r301.elf"
output = "../../build/snr2/gen/r301"
single_file_output = false
output_worker_threads = 4
# 67 routine starts from snr2.py. Authoritative.
ghidra_output = "../../build/snr2/out/r301/r301_functions.csv"
ghidra_map_merge = true
patch_syscalls = false
patch_cop0 = false
patch_cache = false
auto_stub_by_name = false
direct_tail_calls = false
skip = []
stubs = []
# No runtime relocations: every import resolves to a boot .sndata export at static-link time
# (r301_runtime_relocations.csv has 0 rows).

# 60 FPS family 1 (countdowns once a game frame; frame_patches.cpp countdownLoad, flag fps60): the decrement sits in a
# bnez delay slot, so the load before it is raised on second halves.
#   0x79BE14  cR301CannonGame::ExecStart +0xA0: the 30 frames before the explanation (and its world stop)
#   0x79C068  cR301CannonGame::ExecGame +0x78: the cannonball interval (30, then 15 / 12 / 11 by level)
#   0x79C5D8  cR301CannonGame::ChkMastCannonBallHit +0x70
[[patches.hooks]]
address = "0x0079BE14"
hook = "km_fps60_r301_cd_s1_a0"
flag = "fps60"
replace = true

[[patches.hooks]]
address = "0x0079C068"
hook = "km_fps60_r301_cd_s1_78"
flag = "fps60"
replace = true

[[patches.hooks]]
address = "0x0079C5D8"
hook = "km_fps60_r301_cd_s2_70"
flag = "fps60"
replace = true
