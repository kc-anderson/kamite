# r503.rel (SNR2 DLL, "..\PS2_EE_Release\r503.elf") statically linked at 0x00799080 by
#   python -I tools/snr2/gen_modules.py r503   (= tools/snr2/snr2.py emit r503 --base 0x799080)
# and recompiled by 'python -I build.py modules r503' into build/snr2/gen/r503, then packed into
# generated_modules/r503/ (never generated/). Class 'room': slot heap 0x799000/0xF000 (cRelSys_loadSlot ReadAlloc, ra 0x2BE5A0, redirected from heap D 0x754220).
