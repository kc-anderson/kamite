[general]
# The game (USA, SLUS-21503). Modeled on the Urban Reign port's recomp/urban.toml. build.py generate rewrites input and
# output to build/ and makes ghidra_output and runtime_relocations absolute (relative to this folder).
input = "../build/SLUS_215.03"
output = "../generated"
single_file_output = false
output_worker_threads = 8
# Function boundaries (port_prep/boundaries, build_boundaries.py + validate_boundaries.py, 10,553 rows). Every row has a
# non-auto name, so every range is authoritative; the recompiler's own discoveries are kept only outside them.
ghidra_output = "kamite_functions.csv"
ghidra_map_merge = true
patch_syscalls = false
patch_cop0 = false
patch_cache = false
# SDK functions are bound by address to runtime handlers at start-up (src/kamite/hle_bindings.cpp); the CSV carries SDK
# names that would otherwise be stubbed by name (types.h default is true).
auto_stub_by_name = false
# Tail jumps go through the dispatch table, so a replaced (HLE) function is reached by every caller.
direct_tail_calls = false
# .data (0x3BBF80, flags WAX) counts as code for the recompiler, which made 46 functions there on the first generate.
# None is EE code run at its .data address (recomp/kamite_data_section_functions.txt): byte tables (0x3BBF80-0x3C01D8),
# zero buffers (0x3F86C0-0x3FA1C0), a "3100" version string (0x3FAE3C), GS/VIF/DMA packet data (0x3FA1F8, 0x3FD280,
# 0x3FDD40), a 60-byte struct array (0x3FC7B8), and the libkernl kernel-patch blobs that InitExecPS2 (0x3FAF20),
# InitAlarm (0x3FB6E8) and InitTLBFunctions (0x3FBEC0) copy to 0x80074000/0x80076000/0x80075000. No jal or j reaches
# any of them. Skipped by address: each becomes a TODO_NAMED stub (a warning and a return if it were ever called).
skip = [
    "0x003BBF80", "0x003BBFA8", "0x003BBFD0", "0x003BBFF8", "0x003BC200", "0x003BC248",
    "0x003BC380", "0x003BC3A8", "0x003BC3D0", "0x003BC3F8", "0x003BC5E0", "0x003BC5F8",
    "0x003BC610", "0x003BC628", "0x003BF958", "0x003BF970", "0x003BF988", "0x003BF9A0",
    "0x003BFB48", "0x003BFC98", "0x003BFFD0", "0x003BFFE8", "0x003C0000", "0x003C0018",
    "0x003C0138", "0x003C0160", "0x003C0188", "0x003C01B0", "0x003C01D8", "0x003F86C0",
    "0x003F8740", "0x003F9740", "0x003F9800", "0x003F9810", "0x003F9840", "0x003F9C80",
    "0x003FA0C0", "0x003FA1C0", "0x003FA1F8", "0x003FAE3C", "0x003FAF20", "0x003FB6E8",
    "0x003FBEC0", "0x003FC7B8", "0x003FD280", "0x003FDD40",
]
stubs = []
# The 282 boot-ELF .text sites the game's SNR2 loader patches (82 j26, 100 hi16, 100 lo16 in 25 functions); read from
# guest RAM at run time (port_prep/runtime-relocs). The 208 R_MIPS_32 .data slots (kamite_data_import_slots.csv, kind
# w32) are deliberately NOT listed: the recompiler accepts only j26/hi16/lo16 and the slots stay in guest RAM.
runtime_relocations = "kamite_runtime_relocations.csv"

# Switchable patches (ps2xRecomp: both forms are compiled in, the run-time flag picks one; src/kamite/frame_patches.cpp
# sets the flags from kamite.ini and holds the hooks). "fps60": the 60 FPS mode, a port of the PCSX2 patch
# SLUS-21503_6FB69282.pnach "60 Fps" (Puggsy + Claude Ai + Gemini). "frame_hook": always on.
[patches]

# The effect system counts PS2 frames (lui at,0x3F80 -> 0x3F00: a step of 0.5 a game frame). The pnach halved the
# first emitter's frame (func_003029C0, +0x180: "special attack speed") and left its emission countdown and the
# children's frames at 1 a frame, so an emitter lived twice as many game frames and emitted twice as many children in
# that time: the casino and God Hand glows (esp05, a child that lives until its emitter ends) stood two deep at 60 FPS
# (Oct 25). The four steps now agree: both emitters' frames, the emission countdown (func_003035D0 +0x17C) and the
# children's frames (StepObj_advanceFrame +0x234; the code already tolerates fractional frames, its slow-motion path
# makes them). The emitters that emit every frame (mode 0, interval 0) are held to every other frame by a hook.
[[patches.conditional]]
address = "0x00302D04"
value = "0x3C013F00"
flag = "fps60"

[[patches.conditional]]
address = "0x00304500"
value = "0x3C013F00"
flag = "fps60"

[[patches.conditional]]
address = "0x00303910"
value = "0x3C013F00"
flag = "fps60"

[[patches.conditional]]
address = "0x002FCA8C"
value = "0x3C013F00"
flag = "fps60"

# func_003035D0's every-frame emission (the beql at 0x303880 lands here with $v1 = 0; the slow-motion path arrives with
# $v1 != 0 and its own accumulator): on odd game frames the count ($v0) becomes 0.
[[patches.hooks]]
address = "0x003038BC"
hook = "km_fps60_emit_every_frame"
flag = "fps60"

# The HUD's tension bar (func_00142060) eases its shown value toward the gauge by 0.1 of the gap a frame (0x1426BC
# lui / 0x1426C0 ori = 0.1): 1 - 0.9^0.5 = 0.0513 at 60 (0x3D523176), the same easing in real time.
[[patches.conditional]]
address = "0x001426BC"
value = "0x3C013D52"
flag = "fps60"
[[patches.conditional]]
address = "0x001426C0"
value = "0x34213176"
flag = "fps60"

# (The pnach's "Unleash gauge drain" patch at 0x10D694, Gene's speed rate 0.5 in func_0010D3A8, is gone: Gene's rate
# stays the 30 FPS value, which SetMotionStep needs, and its per-frame readers are halved: the God Hand drain 0x12354C,
# the post-hit guard 0x1FD4F8, the spin mash state. claude/fps60-notes.md family 2.)

# The pnach also halved SetMotionStep's 1.0 at 0x10B7B8 ("gene menu": the player's sub-screen state, the Techniques
# screen's move demo). moveMotion already halves every motion's advance when the frame divider is 1 (0x157C7C), so
# that made the demo play at half speed (Oct 25); the patch is gone.

# Enemy physics and animation speed 0.5 ...
[[patches.conditional]]
address = "0x0029059C"
value = "0x3C013F00"
flag = "fps60"

# ... and the enemy animation back to normal: the step passed to 0x158288 is doubled (mov.s f12,f1 -> add.s f12,f1,f1;
# the pnach does lui/mtc1/mul.s by 2.0 in a code cave).
[[patches.conditional]]
address = "0x00290584"
value = "0x46010B00"
flag = "fps60"

# Dodge sync: the add.s f0,f0,f0 in the beql delay slot is not run.
[[patches.conditional]]
address = "0x0015765C"
value = "0x00000000"
flag = "fps60"

# Roulette time (the pnach drops this store, freezing the timer): the player's roulette timer (sw v0,0x15B0(s1), 102
# frames) counts once every 2 frames at 60 FPS (the PS2's time), and half as fast again with [Game] RouletteTimer=double.
[[patches.hooks]]
address = "0x001147CC"
hook = "km_fps60_roulette_timer"
flag = "roulette_timer"
replace = true

# Gene's rate and motion step while the roulette timer counts (swc1 f20,0x5A8(s1), 0.03): halved with the double
# timer, so his cast pose holds until the timer runs out (frame_patches.cpp rouletteCastRate).
[[patches.hooks]]
address = "0x0011481C"
hook = "km_roulette_cast_rate"
flag = "roulette_timer"
replace = true

# HUD and menu animations (cIDBase_move: lbu v0,0x1C(s1), 0 = no animation step): stepped every other frame.
[[patches.hooks]]
