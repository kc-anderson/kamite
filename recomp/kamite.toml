# 60 FPS family 1, second pass (Oct 31, Thinso's cases "Goon attack 30fps / 60fps"): a hooked countdown load (or
# decrement) has copies in branch delay slots that jump past it to the decrement (`bnel/beql/b ... lw v0,0x5F0(s1)` ->
