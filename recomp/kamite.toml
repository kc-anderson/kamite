# blocks than that, and the next texture was put inside it (the shop window under the jukebox, Oct 25).
[[patches.hooks]]
address = "0x00151C70"
hook = "km_texture_slot_size"
flag = "texture_slots"

# Sprint attack traversal ([Game] SprintTraversal; sprint_traversal.cpp): round Gene's wall check in func_00108AB0
# (ChkCollScrWall, jal at 0x1094B8), the stage collision groups marked for the sprint attack he is doing are switched
# off (before: the argument setup at 0x1094A8) and back on (after: 0x1094E0, where both paths and the skip meet).
[[patches.hooks]]
address = "0x001094A8"
hook = "km_trav_off"
flag = "sprint_traversal"

[[patches.hooks]]
address = "0x001094E0"
hook = "km_trav_on"
flag = "sprint_traversal"

# Windows (sprint_traversal.cpp): the wall check's hit path, before Gene's x / z take the pushed-out sp+0x20 / sp+0x28.
[[patches.hooks]]
address = "0x001094C8"
hook = "km_trav_window"
flag = "sprint_traversal"

# 60 FPS: the common enemy code's frame countdowns (cEm00 states and the common update, 0x208000..0x290000; census
# Oct 30, claude/fps60-notes.md family 1): the enemy's step timers +0x5F0 / +0x5F4 / +0x5F8 / +0x5FC, +0x568 / +0x56A /
# +0x56E and the AI waits in func_00208BE0. Seen in case af12321_fight: the light flinch (+0x5F4 = 10) lasted 0.183 s at 60.
# Generated: the addiu (replace) or, when it sits in a delay slot, the load (load-raise, replace).
# Not timers, removed Oct 31 (27 sites; case "Bandana dude 60fps grab attack": the squeeze never ended): decrements
# behind moveMotion's "looped" result (beqz v0 after jal 0x157C18: once per motion loop, e.g. the grab's squeeze count
# +0x56A, +0x5F0 loop counts) or behind a face-button press (GameWork +8 & 0xF0: the grab mash meters +0x568). They
# happen as often per second at 60 as at 30; the every-other-frame countdown made the squeeze count never drop (the loop
# end always fell on a skipped frame) and halved the mash. Kept: plain per-frame decrements.
[[patches.hooks]] # func_00208BE0 lw +0x16DC (decrement in a delay slot: load-raise)
